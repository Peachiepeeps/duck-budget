name: Add Bill Occurrence Options

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-bills:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add bill occurrence options
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode | gzip --decompress > /tmp/update_duck_budget_bills.py
          python3 /tmp/update_duck_budget_bills.py

      - name: Commit update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if [ -f service-worker.js ]; then git add service-worker.js; fi
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Add bill occurrence options"
            git push
          fi
