<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#78b98b" />
  <meta name="application-name" content="Duck Budget" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Duck Budget" />
  <title>Duck Budget</title>
  <meta name="duck-budget-build" content="bill-schedules-biweekly-v1" />
  <link rel="manifest" href="manifest.json?v=2" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/budgeticon-180.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/budgeticon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="images/budgeticon-512.png" />
  <style>
    :root {
      --green-900:#315743;
      --green-800:#3e6a51;
      --green-700:#4e7f60;
      --green-600:#66a77d;
      --green-500:#78b98b;
      --green-300:#b9dfc3;
      --green-200:#d6eddc;
      --green-100:#edf8ef;
      --cream:#fffaf0;
      --paper:#fffef9;
      --ink:#2f3a33;
      --muted:#758078;
      --line:#dfe8e1;
      --shadow:0 8px 24px rgba(45,74,57,.10);
      --danger:#b44b56;
      --danger-soft:#f9e4e6;
      --warning:#a77722;
      --warning-soft:#fff1cf;
      --food:#f4b46f;
      --fun:#eaa7bd;
      --bills:#f2d66b;
      --shopping:#c9b2e8;
      --savings:#9ed7b0;
      --debt:#ee9a9a;
      --income:#9bbfd9;
    }
    *{box-sizing:border-box}
    html{background:var(--green-100)}
    body{
      margin:0;
      color:var(--ink);
      background:linear-gradient(180deg,#f6fbf7 0%,#edf7ef 100%);
      font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height:100dvh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(102,167,125,.35);outline-offset:2px}
    .app{
      width:min(100%,520px);
      margin:0 auto;
      min-height:100dvh;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:var(--green-200);display:grid;place-items:center;font-size:24px;overflow:hidden;border:1px solid rgba(49,87,67,.08)}
    .brand-mark img{width:100%;height:100%;object-fit:cover}
    .brand h1{font-size:21px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
    .brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .icon-btn{border:0;background:var(--paper);width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;color:var(--green-900)}
    .page{display:none;animation:fade .18s ease}
    .page.active{display:block}
    @keyframes fade{from{opacity:.5;transform:translateY(2px)}to{opacity:1;transform:none}}
    .card{background:var(--paper);border:1px solid rgba(49,87,67,.08);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .hero{background:linear-gradient(145deg,#416d53,#6eaa7d);color:white;padding:20px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);right:-85px;top:-90px}
    .eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;opacity:.78}
    .hero-value{font-size:42px;line-height:1.05;font-weight:900;letter-spacing:-.04em;margin:6px 0 4px;word-break:break-word}
    .hero-sub{font-size:13px;opacity:.9}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
    .hero-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px}
    .hero-stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.72}
    .hero-stat strong{display:block;font-size:16px;margin-top:2px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
    .section-head h2{font-size:16px;margin:0;letter-spacing:-.01em}
    .section-head button,.text-btn{border:0;background:none;color:var(--green-700);font-weight:800;padding:6px;font-size:13px}
    .empty{text-align:center;padding:24px 10px;color:var(--muted)}
    .empty .big{font-size:34px;margin-bottom:6px}
    .empty strong{display:block;color:var(--ink);margin-bottom:4px}
    .btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;min-height:44px}
    .btn.primary{background:var(--green-700);color:white}
    .btn.soft{background:var(--green-100);color:var(--green-900)}
    .btn.warn{background:var(--warning-soft);color:var(--warning)}
    .btn.danger{background:var(--danger-soft);color:var(--danger)}
    .btn.full{width:100%}
    .btn-row{display:flex;gap:9px;flex-wrap:wrap}
    .btn-row .btn{flex:1 1 130px}
    .budget-list{display:grid;gap:11px}
    .budget-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
    .duck-avatar{position:relative;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:var(--green-100);font-size:22px;flex:0 0 auto}
    .duck-avatar .duck-fallback{position:absolute;inset:0;display:grid;place-items:center}
    .duck-avatar img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;background:transparent}
    .duck-avatar.tiny{width:30px;height:30px;border-radius:10px;font-size:16px}
    .icon-label{display:flex;align-items:center;gap:8px;min-width:0}
    .icon-label > span:last-child{min-width:0}
    .asset-icon{width:30px;height:30px;object-fit:contain;vertical-align:middle;display:inline-block}
    .asset-icon.coin{width:24px;height:24px}
    .section-duck-title{display:flex;align-items:center;gap:9px}
    .section-duck-title .duck-avatar{width:40px;height:40px;border-radius:13px}
    .debt-card{padding:14px;border:1px solid var(--line);border-radius:18px;background:white}
    .debt-card + .debt-card{margin-top:9px}
    .debt-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .debt-top strong{font-size:15px}
    .debt-top .amount{font-size:13px}
    .budget-copy{min-width:0}
    .budget-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .budget-top strong{font-size:14px}
    .budget-top span{font-size:12px;color:var(--muted);white-space:nowrap}
    .progress{height:8px;background:#edf1ed;border-radius:999px;overflow:hidden;margin-top:7px}
    .progress > span{display:block;height:100%;border-radius:inherit;background:var(--green-600);width:0;transition:width .2s ease}
    .progress.over > span{background:var(--danger)}
    .budget-left{font-size:12px;font-weight:800;color:var(--green-800);white-space:nowrap}
    .budget-left.over{color:var(--danger)}
    .list{display:grid;gap:8px}
    .list-item{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:16px;background:white;min-width:0}
    .item-copy{min-width:0;flex:1}
    .item-copy strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .amount{font-weight:900;font-size:14px;white-space:nowrap}
    .amount.income{color:var(--green-700)}
    .mini-action{border:0;background:var(--green-100);color:var(--green-800);font-weight:800;font-size:12px;border-radius:10px;padding:8px 10px;min-height:34px}
    .mini-action.danger{background:var(--danger-soft);color:var(--danger)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{border:1px solid var(--line);border-radius:17px;padding:13px;background:white}
    .metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
    .metric strong{display:block;margin-top:5px;font-size:20px;letter-spacing:-.02em}
    .page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
    .page-title h2{margin:0;font-size:24px;letter-spacing:-.03em}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--green-100);color:var(--green-800);font-size:11px;font-weight:800;padding:6px 9px}
    .pill.overdue{background:var(--danger-soft);color:var(--danger)}
    .pill.paid{background:#e4f4e8;color:#39724a}
    .plan-name{font-size:20px;font-weight:900;margin:3px 0 2px}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .planner-alloc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .alloc{border-radius:16px;padding:12px;border:1px solid var(--line);background:white}
    .alloc strong{display:block;font-size:13px}
    .alloc span{display:block;font-size:18px;font-weight:900;margin-top:4px}
    .goal-card{padding:14px;border:1px solid var(--line);border-radius:18px;background:white}
    .goal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .goal-top strong{font-size:15px}
    .goal-top .amount{font-size:13px}
    .goal-actions{display:flex;gap:8px;margin-top:10px}
    .goal-actions button{flex:1}
    .fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--green-800);color:white;font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(49,87,67,.28);z-index:25}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);z-index:20;background:rgba(255,254,249,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
    .nav-btn{border:0;background:transparent;color:var(--muted);min-height:55px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:800}
    .nav-btn .nav-icon{width:28px;height:28px;display:grid;place-items:center;line-height:1}
    .nav-btn .nav-icon img{width:100%;height:100%;object-fit:contain;display:block}
    .nav-btn.active{background:var(--green-100);color:var(--green-900)}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(25,38,30,.34);z-index:60;display:none;align-items:flex-end;justify-content:center;padding-top:32px}
    .sheet-backdrop.open{display:flex}
    .sheet{width:min(100%,520px);max-height:92dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(24,45,31,.18)}
    .sheet-handle{width:46px;height:5px;border-radius:999px;background:#d9ded9;margin:0 auto 12px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .sheet-head h2{font-size:20px;margin:0}
    .close-btn{border:0;background:var(--green-100);width:40px;height:40px;border-radius:13px;font-size:18px;color:var(--green-900)}
    .form-grid{display:grid;gap:13px}
    .field label{display:block;font-size:12px;font-weight:900;margin:0 0 6px;color:var(--green-900)}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dce5de;background:white;border-radius:13px;padding:12px 12px;color:var(--ink);min-height:46px;font-size:16px}
    .field textarea{min-height:82px;resize:vertical}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .help{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
    .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--green-100);border-radius:14px;padding:4px}
    .segmented button{border:0;background:transparent;color:var(--green-800);padding:9px 5px;border-radius:11px;font-size:11px;font-weight:900;min-height:42px}
    .segmented button.active{background:white;box-shadow:0 3px 10px rgba(49,87,67,.08);color:var(--ink)}
    .category-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .cat-choice{border:1px solid var(--line);background:white;border-radius:14px;padding:8px 5px;min-height:76px;font-size:10px;font-weight:800;color:var(--ink)}
    .cat-choice .duck-avatar{width:38px;height:38px;margin:0 auto 4px;border-radius:12px}
    .cat-choice.selected{border:2px solid var(--green-600);background:var(--green-100)}
    .notice{border-radius:15px;padding:11px 12px;font-size:12px;line-height:1.45;background:var(--green-100);color:var(--green-900)}
    .notice.warn{background:var(--warning-soft);color:#765518}
    .notice.danger{background:var(--danger-soft);color:#863843}
    .divider{height:1px;background:var(--line);margin:16px 0}
    .settings-section h3{font-size:15px;margin:0 0 9px}
    .settings-section + .settings-section{margin-top:20px}
    .hidden{display:none!important}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom));z-index:100;background:#2f4537;color:white;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
    @media(min-width:700px){
      body{padding:18px 0}.app{border-radius:28px;background:#f5faf6;box-shadow:0 18px 60px rgba(45,74,57,.12);min-height:calc(100dvh - 36px)}
      .bottom-nav{bottom:18px;border:1px solid var(--line);border-radius:20px;width:500px;padding:7px}
      .fab{bottom:98px}
      .sheet{border-radius:26px;margin-bottom:18px;max-height:88dvh}
      .sheet-backdrop{align-items:flex-end}
    }


    /* Catch-Up Home: intentionally separate from paycheck allocation math. */
    .bottom-nav.simple-nav{grid-template-columns:repeat(3,1fr)}
    .simple-nav [data-tab="transactions"],.simple-nav [data-tab="planner"]{display:none}
    .catchup-heading{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
    .catchup-heading h2{font-size:23px;margin:0 0 3px;letter-spacing:-.03em}
    .catchup-tag{font-weight:800;font-size:11px;color:var(--green-700);background:var(--green-100);padding:7px 9px;border-radius:20px}
    .catchup-hero{background:linear-gradient(135deg,#426d54,#6eaa80);color:white}
    .catchup-hero .eyebrow{opacity:.9}
    .catchup-hero .hero-value{font-size:40px;margin:8px 0 6px}
    .catchup-hero .simple-hero-desc{font-size:12px;line-height:1.55;opacity:.94}
    .catchup-hero .btn{background:white;color:var(--green-900);min-height:42px;margin-top:14px}
    .simple-sum{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}
    .simple-sum>div{padding:12px;border:1px solid rgba(255,255,255,.23);border-radius:14px;background:rgba(255,255,255,.11)}
    .simple-sum small{display:block;font-size:11px;line-height:1.4;opacity:.92}
    .simple-sum strong{display:block;font-size:20px;margin-top:5px;overflow-wrap:anywhere}
    .simple-breakdown{display:grid;gap:10px;margin-top:13px}
    .simple-breakdown>div{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13px}
    .simple-breakdown b{font-size:14px;white-space:nowrap}
    .simple-breakdown .simple-rule{border-top:1px solid var(--line);padding-top:12px}
    .simple-footnote{font-size:11px;line-height:1.5;color:var(--muted);margin-top:11px}
    .simple-next{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
    .simple-next strong{display:block;font-size:19px;line-height:1.3;margin:6px 0}
    .simple-next small{display:block;color:var(--muted);line-height:1.45}
    .simple-big-number{font-size:26px;font-weight:900;letter-spacing:-.02em}
    .simple-subtext{font-size:12px;color:var(--muted);line-height:1.5}
    .catchup-card-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
    .catchup-card-title h3{font-size:15px;margin:0}
    .catchup-step{display:flex;align-items:center;gap:10px;margin:11px 0 0;font-size:12px;color:var(--green-900)}
    .catchup-step span{background:var(--green-100);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex-shrink:0}
    .simple-empty{padding:10px 0;font-size:12px;color:var(--muted);line-height:1.5}

    /* Weekly shopping & meal planning */
    .shopping-entry{display:flex;align-items:center;gap:13px;background:linear-gradient(125deg,#f6efff,#fffdfa);border-color:#e7d8f5}
    .shopping-entry .duck-avatar{width:58px;height:58px;border-radius:18px;flex-shrink:0}
    .shopping-entry-copy{flex:1;min-width:0}
    .shopping-entry-copy strong{display:block;font-size:16px;color:var(--green-900)}
    .shopping-entry-copy span{display:block;font-size:12px;line-height:1.5;color:#657265;margin-top:3px}
    .shopping-entry-button{border:0;border-radius:13px;padding:10px 12px;background:#6b538a;color:white;font-size:12px;font-weight:900;min-height:44px;flex-shrink:0}
    .shopping-heading{display:flex;gap:11px;align-items:center}
    .shopping-heading h2{margin:0}
    .shopping-heading .duck-avatar{width:45px;height:45px}
    .shopping-week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}
    .shopping-week-nav .mini-action{min-width:44px;min-height:44px;font-size:17px}
    .shopping-week-label{text-align:center;font-weight:900;font-size:16px}
    .shopping-week-label small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
    .shopping-summary{background:linear-gradient(145deg,#594d75,#8372a4);color:white}
    .shopping-summary .eyebrow{opacity:.9}
    .shopping-budget-line{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .shopping-budget-value{font-size:35px;font-weight:900;letter-spacing:-.04em;margin:5px 0}
    .shopping-summary .btn{background:rgba(255,255,255,.18);color:white;border:1px solid rgba(255,255,255,.4);min-height:42px}
    .shopping-summary .progress{background:rgba(255,255,255,.22);height:11px;margin:13px 0 7px}
    .shopping-summary .progress > span{background:#dbd2ff}
    .shopping-summary .progress.over > span{background:#ffd0c9}
    .shopping-metrics{display:flex;gap:10px;margin-top:15px}
    .shopping-metrics>div{flex:1;border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;background:rgba(255,255,255,.1);min-width:0}
    .shopping-metrics span{display:block;font-size:10px;font-weight:800;text-transform:uppercase;opacity:.85;letter-spacing:.04em}
    .shopping-metrics strong{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere}
    .shopping-days{display:grid;gap:9px}
    .shopping-day-row{display:flex;align-items:center;text-align:left;gap:12px;width:100%;padding:12px;border:1px solid var(--line);border-radius:17px;background:#fff;color:var(--ink);min-height:75px}
    .shopping-day-row:active{background:#f5f0fa}
    .shopping-day-icon{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:#f3eaf9;flex-shrink:0;font-size:22px}
    .shopping-day-text{flex:1;min-width:0}
    .shopping-day-text strong{display:block;font-size:14px}
    .shopping-day-text span{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .shopping-day-total{font-weight:900;text-align:right;font-size:13px;white-space:nowrap}
    .shopping-day-total small{display:block;font-weight:700;font-size:10px;color:var(--muted);margin-top:4px}
    .shopping-day-arrow{font-size:19px;color:#9482ac}
    .shopping-day-row.today{border-color:#b9a2d0;background:#fbf8ff}
    .shopping-meal{border:1px solid #e4deeb;background:#fff;border-radius:17px;padding:13px;margin-top:11px}
    .shopping-meal-head{display:flex;align-items:center;justify-content:space-between;gap:9px}
    .shopping-meal-head strong{font-size:15px}
    .shopping-meal-head small{color:var(--muted);display:block;margin-top:3px;font-size:11px}
    .shopping-item-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 0;font-size:13px}

      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Open settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.9 1.9-.07-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-.95 1.55V21h-2.7v-.99a1.7 1.7 0 0 0-.95-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-1.91-1.9.07-.07A1.7 1.7 0 0 0 7.9 15a1.7 1.7 0 0 0-1.56-.95H5.4v-2.7h.94A1.7 1.7 0 0 0 7.9 10.4a1.7 1.7 0 0 0-.34-1.88l-.06-.07 1.9-1.9.07.06a1.7 1.7 0 0 0 1.88.34 1.7 1.7 0 0 0 .95-1.56V4.4h2.7v.99a1.7 1.7 0 0 0 .95 1.56 1.7 1.7 0 0 0 1.88-.34l.07-.06 1.9 1.9-.06.07a1.7 1.7 0 0 0-.34 1.88 1.7 1.7 0 0 0 1.56.95h.94v2.7h-.94a1.7 1.7 0 0 0-1.56.95z"/></svg></button>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'duckBudget_v1';
  const CATEGORIES = {
    income:   { label:'Income', asset:'images/Standard-duck.PNG', color:'var(--income)' },
    bills:    { label:'Bills', asset:'images/sticker-coin.png',     color:'var(--bills)' },
    food:     { label:'Food', asset:'images/Burger-duck.PNG',    color:'var(--food)' },
    fun:      { label:'Fun', asset:'images/Party-hat-duck.PNG',     color:'var(--fun)' },
    shopping: { label:'Shopping / Other', asset:'images/Standard-duck.PNG', color:'var(--shopping)' },
    savings:  { label:'Savings', asset:'images/sticker-crown.png',     color:'var(--savings)' },
    debt:     { label:'Debt', asset:'images/Standard-duck.PNG',     color:'var(--debt)' }
  };
  const BUDGET_CATEGORIES = ['bills','food','fun','shopping','savings','debt'];
  const FLEX_CATEGORIES = ['food','fun','shopping'];
  const FIXED_CATEGORIES = ['bills','savings','debt'];

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const todayISO = () => {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  };
  const parseDate = (s) => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))) return null;
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y,m-1,d,12,0,0,0);
  };
  const toISO = (d) => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  const formatDate = (s, opts={month:'short',day:'numeric'}) => {
    const d=parseDate(s); return d ? new Intl.DateTimeFormat(undefined,opts).format(d) : '—';
  };
  const daysBetween = (a,b) => {
    const da=parseDate(a), db=parseDate(b); if(!da||!db) return null;
    return Math.ceil((db-da)/86400000);
  };
  const money = (n) => {
    const value=Number(n)||0;
    return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
  };
  const num = (v) => Math.max(0, Number.parseFloat(v)||0);
  const escapeHtml = (v='') => String(v).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

  const defaultSimple = () => ({
    enabled:true, balance:null, balanceUpdatedAt:'', nextPayday:'', typicalTakeHome:null,
    advanceCycles:{}, essentials:0, bufferReserved:0, bufferTarget:100
  });
  const defaultState = () => ({ version:3, plans:[], transactions:[], bills:[], goals:[], debts:[], shoppingWeeks:{}, simple:defaultSimple() });
  let state = loadState();
  let currentTab = 'home';
  let shoppingWeekStart = weekStartISO(todayISO());
  let toastTimer = null;
  let deferredInstallPrompt = null;

  window.addEventListener('beforeinstallprompt', event => {
    event.preventDefault();
    deferredInstallPrompt = event;
  });
  window.addEventListener('appinstalled', () => {
    deferredInstallPrompt = null;
    showToast('Duck Budget installed!');
  });


  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed=JSON.parse(raw);
      return normalizeState(parsed);
    }catch(err){ return defaultState(); }
  }
  function normalizeState(data){
    const base=defaultState();
    if(!data || typeof data!=='object') return base;
    for(const key of ['plans','transactions','bills','goals','debts']) base[key]=Array.isArray(data[key])?data[key]:[];
    if(data.shoppingWeeks && typeof data.shoppingWeeks==='object' && !Array.isArray(data.shoppingWeeks)){
      // Keep the shopping weeks from backups and existing data, without changing earlier budgets.
      base.shoppingWeeks=Object.assign(Object.create(null),data.shoppingWeeks);
    }
    if(data.simple && typeof data.simple==='object' && !Array.isArray(data.simple)){
      const old=data.simple, newer=defaultSimple();
      newer.enabled=old.enabled!==false;
      newer.balance=old.balance===null || old.balance===undefined ? null : (Number.isFinite(Number(old.balance))?Number(old.balance):null);
      newer.balanceUpdatedAt=typeof old.balanceUpdatedAt==='string'?old.balanceUpdatedAt:'';
      newer.nextPayday=parseDate(old.nextPayday)?old.nextPayday:'';
      newer.typicalTakeHome=old.typicalTakeHome===null || old.typicalTakeHome===undefined ? null : num(old.typicalTakeHome);
      newer.essentials=num(old.essentials);
      newer.bufferReserved=num(old.bufferReserved);
      newer.bufferTarget=num(old.bufferTarget);
      if(old.advanceCycles && typeof old.advanceCycles==='object' && !Array.isArray(old.advanceCycles)){
        for(const [day,amounts] of Object.entries(old.advanceCycles)){
          if(parseDate(day) && amounts && typeof amounts==='object') newer.advanceCycles[day]={advance:num(amounts.advance),other:num(amounts.other)};
        }
      }
      base.simple=newer;
    }
    return base;
  }
  function saveState(message){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      if(message) showToast(message);
    }catch(err){
      showToast('Could not save on this device. Try exporting a backup.');
    }
    renderAll();
  }
  function showToast(text){
    const t=$('#toast'); t.textContent=text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
  }

  function currentPlan(){
    return state.plans.find(p=>p.active) || state.plans.slice().sort((a,b)=>String(b.startDate).localeCompare(String(a.startDate)))[0] || null;
  }
  function planTransactions(planId){ return state.transactions.filter(t=>t.planId===planId); }
  function categorySpent(plan, category){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.category===category && t.type!=='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function planExtraIncome(plan){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function totalOutgoing(plan){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.type!=='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function safeToSpend(plan){
    if(!plan) return 0;
    const available=num(plan.income)+planExtraIncome(plan);
    const spent=totalOutgoing(plan);
    const fixedRemaining=FIXED_CATEGORIES.reduce((sum,c)=>{
      const planned=num(plan.budgets?.[c]);
      const used=categorySpent(plan,c);
      return sum+Math.max(0,planned-used);
    },0);
    return available-spent-fixedRemaining;
  }
  function remainingInPlan(plan){ return plan ? num(plan.income)+planExtraIncome(plan)-totalOutgoing(plan) : 0; }
  function unassigned(plan){ return plan ? num(plan.income)-BUDGET_CATEGORIES.reduce((s,c)=>s+num(plan.budgets?.[c]),0) : 0; }

  function duck(category, cls=''){
    const c=CATEGORIES[category]||CATEGORIES.shopping;
    return `<span class="duck-avatar ${cls}" style="background:${c.color}"><img src="${c.asset}" alt="" onerror="this.style.display='none'"></span>`;
  }
  function assetIcon(path, cls='', alt=''){
    return `<img class="asset-icon ${cls}" src="${path}" alt="${escapeHtml(alt)}" onerror="this.style.display='none'">`;
  }
  function coinIcon(cls='coin'){
    return assetIcon('images/heart-coin.png',cls,'Heart coin');
  }

  function ordinal(n){
    const value=Number(n);
    const mod100=value%100;
    if(mod100>=11 && mod100<=13) return `${value}th`;
    return `${value}${value%10===1?'st':value%10===2?'nd':value%10===3?'rd':'th'}`;
  }
  function billFrequency(bill){
    return bill?.frequency || 'monthly';
  }
  function billScheduleLabel(bill){
    const frequency=billFrequency(bill);
    if(frequency==='monthly'){
      return String(bill.dueDay)==='last' ? 'Monthly on the last day' : `Monthly on the ${ordinal(Number(bill.dueDay)||1)}`;
    }
    if(frequency==='biweekly') return 'Every 2 weeks';
    if(frequency==='quarterly') return 'Quarterly';
    if(frequency==='semiannual') return 'Every 6 months';
    if(frequency==='yearly') return 'Yearly';
    if(frequency==='once') return 'One-time';
    return 'Scheduled';
  }
  function monthlyDueDate(year,month,dueDay){
    const maxDay=new Date(year,month+1,0).getDate();
    const day=String(dueDay)==='last' ? maxDay : Math.min(Math.max(1,Number(dueDay)||1),maxDay);
    return new Date(year,month,day,12);
  }
  function addMonthsClamped(date,months){
    const targetMonth=date.getMonth()+months;
    const year=date.getFullYear()+Math.floor(targetMonth/12);
    const month=((targetMonth%12)+12)%12;
    const maxDay=new Date(year,month+1,0).getDate();
    return new Date(year,month,Math.min(date.getDate(),maxDay),12);
  }
  function billOccurrencesBetween(bill,startISO,endISO){
    const start=parseDate(startISO), end=parseDate(endISO); if(!start||!end||end<=start) return [];
    const frequency=billFrequency(bill);
    const out=[];

    if(frequency==='monthly'){
      let cursor=new Date(start.getFullYear(),start.getMonth(),1,12);
      const endMonth=new Date(end.getFullYear(),end.getMonth(),1,12);
      while(cursor<=endMonth && out.length<60){
        const d=monthlyDueDate(cursor.getFullYear(),cursor.getMonth(),bill.dueDay);
        if(d>=start && d<end) out.push(toISO(d));
        cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);
      }
      return out;
    }

    const anchor=parseDate(bill.anchorDate);
    if(!anchor) return out;
    if(frequency==='once'){
      if(anchor>=start && anchor<end) out.push(toISO(anchor));
      return out;
    }

    if(frequency==='biweekly'){
      const dayMs=24*60*60*1000;
      const diffDays=Math.floor((start-anchor)/dayMs);
      let step=Math.max(0,Math.floor(diffDays/14)-1);
      while(step<1000 && out.length<120){
        const d=new Date(anchor.getFullYear(),anchor.getMonth(),anchor.getDate(),12);
        d.setDate(d.getDate()+step*14);
        if(d>=end) break;
        if(d>=start && d>=anchor) out.push(toISO(d));
        step++;
      }
      return out;
    }

    const intervalMonths=frequency==='quarterly'?3:frequency==='semiannual'?6:12;
    const monthDiff=(start.getFullYear()-anchor.getFullYear())*12+(start.getMonth()-anchor.getMonth());
    let step=Math.max(0,Math.floor(monthDiff/intervalMonths)-1);

    while(step<240 && out.length<60){
      const d=addMonthsClamped(anchor,step*intervalMonths);
      if(d>=end) break;
      if(d>=start && d>=anchor) out.push(toISO(d));
      step++;
    }
    return out;
  }
  function suggestedBills(plan){
    if(!plan) return {total:0,items:[]};
    const items=[];
    state.bills.forEach(b=>billOccurrencesBetween(b,plan.startDate,plan.nextPayDate).forEach(date=>items.push({bill:b,date})));
    return { total:items.reduce((s,x)=>s+num(x.bill.amount),0), items:items.sort((a,b)=>a.date.localeCompare(b.date)) };
  }
  function isBillOccurrencePaid(billId,dueISO){
    const due=parseDate(dueISO); if(!due) return false;
    return state.transactions.some(t=>{
      if(t.billId!==billId || t.type!=='expense') return false;
      if(t.billDueDate) return t.billDueDate===dueISO;
      const td=parseDate(t.date);
      return td && td.getFullYear()===due.getFullYear() && td.getMonth()===due.getMonth();
    });
  }
  function nextBillOccurrence(bill){
    const today=parseDate(todayISO());
    if(!today) return null;

    const frequency=billFrequency(bill);
    if(frequency==='once'){
      const date=bill.anchorDate;
      return date && !isBillOccurrencePaid(bill.id,date) ? date : null;
    }

    const lookback=new Date(today.getFullYear()-1,today.getMonth(),today.getDate(),12);
    const future=new Date(today.getFullYear()+2,today.getMonth()+1,today.getDate(),12);
    const occurrences=billOccurrencesBetween(bill,toISO(lookback),toISO(future));

    const unpaidPast=occurrences
      .filter(date=>(!bill.createdOn || date>=bill.createdOn) && parseDate(date)<today && !isBillOccurrencePaid(bill.id,date))
      .sort((a,b)=>b.localeCompare(a));
    if(unpaidPast.length) return unpaidPast[0];

    return occurrences.find(date=>(!bill.createdOn || date>=bill.createdOn) && parseDate(date)>=today && !isBillOccurrencePaid(bill.id,date)) || null;
  }
  function upcomingBills(limit=99){
    return state.bills.map(b=>({bill:b,date:nextBillOccurrence(b)})).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit);
  }
  function goalSaved(goal){
    return num(goal.startingSaved)+state.transactions.filter(t=>t.type==='savings'&&t.goalId===goal.id).reduce((s,t)=>s+num(t.amount),0);
  }
  function debtRemaining(debt){
    const paid=state.transactions.filter(t=>t.type==='debt'&&t.debtId===debt.id).reduce((s,t)=>s+num(t.amount),0);
    return Math.max(0,num(debt.startingBalance)-paid);
  }

    const usePayday=payday && payday>=today;
    const cutoff=usePayday?payday:shiftISO(today,13);
    const earliest=shiftISO(today,-31);
    const items=[];
    for(const bill of state.bills){
      for(const date of billOccurrencesBetween(bill,earliest,shiftISO(cutoff,1))){
        if((!bill.createdOn || date>=bill.createdOn) && !isBillOccurrencePaid(bill.id,date)) items.push({bill,date});
      }
    }
    items.sort((a,b)=>a.date.localeCompare(b.date));
    return {items, cutoff, usesPayday:!!usePayday,total:Math.round(items.reduce((sum,x)=>sum+num(x.bill.amount),0)*100)/100};
  }

  function goalMini(goal){

  function goalFull(goal){

  function debtFull(debt){

  // Each Sunday–Saturday week has its own independent grocery budget and meal plan.
  // Meals are planning estimates; they do not become real transactions automatically.
  const SHOPPING_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function weekStartISO(iso){
    const date=parseDate(iso)||parseDate(todayISO());
    date.setDate(date.getDate()-date.getDay());
    return toISO(date);
  }
  function shiftISO(iso,days){const d=parseDate(iso); d.setDate(d.getDate()+days); return toISO(d);}
  let shoppingView='meals';
  function blankShoppingWeek(){return {budget:null,days:Array.from({length:7},()=>({meals:[]}))};}
  function viewShoppingWeek(){return state.shoppingWeeks?.[shoppingWeekStart]||blankShoppingWeek();}
  function editShoppingWeek(){
    if(!state.shoppingWeeks || typeof state.shoppingWeeks!=='object') state.shoppingWeeks={};
    if(!state.shoppingWeeks[shoppingWeekStart]) state.shoppingWeeks[shoppingWeekStart]=blankShoppingWeek();
    return state.shoppingWeeks[shoppingWeekStart];
  }
  function shoppingDayMeals(day){return viewShoppingWeek().days?.[day]?.meals||[];}
  function editShoppingDay(day){
    const week=editShoppingWeek();
    if(!Array.isArray(week.days)) week.days=blankShoppingWeek().days;
    if(!week.days[day]) week.days[day]={meals:[]};
    if(!Array.isArray(week.days[day].meals)) week.days[day].meals=[];
    return week.days[day].meals;
  }
  const shoppingItemCents=item=>Math.round(num(item.cost)*100);
  const shoppingMealCents=meal=>(meal.items||[]).reduce((sum,item)=>sum+shoppingItemCents(item),0);
  const shoppingDayCents=day=>shoppingDayMeals(day).reduce((sum,meal)=>sum+shoppingMealCents(meal),0);
  const shoppingWeekCents=()=>SHOPPING_DAYS.reduce((sum,_,i)=>sum+shoppingDayCents(i),0);
  function shoppingHomeCard(){
    const week=viewShoppingWeek();
    const total=shoppingWeekCents()/100;
    const budget=week.budget===null||week.budget===undefined?'No budget yet':money(week.budget)+' budget';
    return `<div class="card shopping-entry">
      ${duck('shopping')}
      <div class="shopping-entry-copy"><strong>Shopping & Meals</strong><span>Plan Sun–Sat meals, add ingredients and prices. ${money(total)} planned · ${budget}</span></div>
      <button class="shopping-entry-button" type="button" id="homeShoppingBtn">Open →</button>
    </div>`;
  }
  function renderShopping(){

    const progress=budgetCents>0?Math.min(100,100*costCents/budgetCents):(costCents>0?100:0);
    const isOver=isSet && costCents>budgetCents;
    const range=`${formatDate(shoppingWeekStart)} – ${formatDate(shiftISO(shoppingWeekStart,6))}`;
    const currentWeek=shoppingWeekStart===weekStartISO(todayISO());
    const dayRows=SHOPPING_DAYS.map((name,i)=>{
      const meals=shoppingDayMeals(i);

      const names=meals.map(m=>m.name).filter(Boolean).join(' · ');

        <span class="shopping-day-text"><strong>${name} <span style="display:inline;color:var(--muted);font-weight:600">${formatDate(date)}</span></strong><span>${meals.length?escapeHtml(names||'Unnamed meals'):'Tap to build meals + add costs'}</span></span>

    const checked=shoppingItems.filter(x=>x.item.checked).length;
    const wasOpen=$('#shoppingChecklist')?.open||false;
    root.innerHTML=`
      <div class="page-title"><div class="shopping-heading">${duck('food')}<div><h2>Shopping & Meals</h2><div class="small muted">A cozy grocery plan, one week at a time</div></div></div><button class="shopping-back" id="shoppingBack" type="button">← Home</button></div>

      </div>
      <div class="card shopping-summary">
        <div class="shopping-budget-line"><div><div class="eyebrow">Weekly grocery budget</div><div class="shopping-budget-value">${isSet?money(week.budget):'Not set'}</div></div><button class="btn" type="button" id="shoppingBudgetBtn">${isSet?'Edit':'Set'} budget</button></div>
        <div class="progress ${isOver?'over':''}" role="progressbar" aria-label="Weekly planned grocery costs" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(progress)}"><span style="width:${progress}%"></span></div>
        <div class="shopping-metrics"><div><span>Planned total</span><strong>${money(costCents/100)}</strong></div><div><span>${isSet?(isOver?'Over budget':'Left to spend'):'Remaining'}</span><strong>${isSet?money(Math.abs(leftCents)/100):'—'}</strong></div></div>

      ${shoppingView==='meals'?`<div class="card shopping-day-card"><div class="shopping-days">${dayRows}</div></div><div class="one-screen-note">Estimated costs only. Buying groceries won't automatically subtract from your account balance.</div>`:`<div class="card shopping-list-card"><div class="small muted" style="margin:0 0 9px">Tap to check items off as you shop. Items in more than one meal appear separately.</div><div id="shoppingChecklist">
        ${shoppingItems.length?shoppingItems.map(({di,day,meal,item})=>`<label class="shopping-check-row ${item.checked?'checked':''}"><input type="checkbox" data-shop-check="${escapeHtml(item.id)}" data-shop-day="${di}" data-shop-meal="${escapeHtml(meal.id)}" ${item.checked?'checked':''}><span><span class="shopping-check-label">${escapeHtml(item.name)}</span><small>${day} • ${escapeHtml(meal.name)}</small></span><b>${money(shoppingItemCents(item)/100)}</b></label>`).join(''):'<div class="small muted" style="margin-top:12px">Add items to your meals and they’ll appear here!</div>'}

    $('#shoppingNext').addEventListener('click',()=>{shoppingWeekStart=shiftISO(shoppingWeekStart,7);renderAll();});
    $('#shoppingThisWeek')?.addEventListener('click',()=>{shoppingWeekStart=weekStartISO(todayISO());renderAll();});
    $$('[data-shopping-view]',root).forEach(b=>b.addEventListener('click',()=>{shoppingView=b.dataset.shoppingView;renderShopping();}));
    $('#shoppingBudgetBtn').addEventListener('click',openShoppingBudget);

    $$('[data-shop-check]',root).forEach(input=>input.addEventListener('change',()=>{

  }

  function openShoppingItemEdit(dayIndex,mealId,itemId){

      <form id="txForm" class="form-grid">
        <div class="field"><label>Type</label><div class="segmented" id="txTypePicker">
          ${['expense','income','savings','debt'].map(t=>`<button type="button" data-type="${t}" class="${type===t?'active':''}">${t==='expense'?'Expense':t==='income'?'Income':t==='savings'?'Savings':'Debt'}</button>`).join('')}
        </div></div>
        <div class="field"><label for="txAmount">Amount</label><input id="txAmount" inputmode="decimal" type="number" min="0" step="0.01" required value="${existing?escapeHtml(existing.amount):''}" placeholder="0.00"></div>
        <div class="field" id="categoryField"><label>Category duck</label><div class="category-picker" id="categoryPicker">${['food','fun','bills','shopping'].map(c=>`<button type="button" class="cat-choice ${category===c?'selected':''}" data-category="${c}">${duck(c)}<span>${CATEGORIES[c].label}</span></button>`).join('')}</div></div>
        <div class="field hidden" id="goalField"><label for="txGoal">Savings goal</label><select id="txGoal"><option value="">No specific goal</option>${state.goals.map(g=>`<option value="${g.id}" ${(existing?.goalId||preset.goalId)===g.id?'selected':''}>${escapeHtml(g.name)}</option>`).join('')}</select></div>
        <div class="field hidden" id="debtField"><label for="txDebt">Debt</label><select id="txDebt"><option value="">Choose debt</option>${state.debts.map(d=>`<option value="${d.id}" ${(existing?.debtId||preset.debtId)===d.id?'selected':''}>${escapeHtml(d.name)}</option>`).join('')}</select>${state.debts.length?'':'<div class="help">Add a debt from the Goals tab first.</div>'}</div>
        <div class="field hidden" id="billField"><label for="txBill">Bill</label><select id="txBill"><option value="">General bill / no link</option>${state.bills.map(b=>`<option value="${b.id}" ${existing?.billId===b.id?'selected':''}>${escapeHtml(b.name)}</option>`).join('')}</select></div>
        <div class="field"><label for="txNote">What was it?</label><input id="txNote" maxlength="80" value="${escapeHtml(existing?.note||'')}" placeholder="Lunch, Target, refund…"></div>
        <div class="field-row"><div class="field"><label for="txDate">Date</label><input id="txDate" type="date" required value="${escapeHtml(existing?.date||todayISO())}"></div><div class="field"><label for="txPlan">Paycheck plan</label><select id="txPlan"><option value="">No plan</option>${plans.map(p=>`<option value="${p.id}" ${(existing?.planId||plan?.id)===p.id?'selected':''}>${escapeHtml(p.name||formatDate(p.startDate))}</option>`).join('')}</select></div></div>
        <button class="btn primary full" type="submit">${existing?'Save changes':'Add transaction'}</button>
        ${existing?'<button class="btn danger full" id="deleteTxBtn" type="button">Delete transaction</button>':''}
      </form>`);
    const setType=(newType)=>{
      type=newType;
      $$('#txTypePicker button').forEach(b=>b.classList.toggle('active',b.dataset.type===type));
      $('#categoryField').classList.toggle('hidden',type!=='expense');
      $('#goalField').classList.toggle('hidden',type!=='savings');
      $('#debtField').classList.toggle('hidden',type!=='debt');
      if(type==='income') category='income';
      if(type==='savings') category='savings';
      if(type==='debt') category='debt';
      $('#billField').classList.toggle('hidden',!(type==='expense'&&category==='bills'));
    };
    $$('#txTypePicker button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));

      category=b.dataset.category; $$('#categoryPicker .cat-choice').forEach(x=>x.classList.toggle('selected',x===b));

        note:$('#txNote').value.trim(), date:$('#txDate').value||todayISO(), planId:$('#txPlan').value||'',
        goalId:type==='savings'?$('#txGoal').value:'', debtId:type==='debt'?$('#txDebt').value:'',

  function openBillForm(id=null){
    const b=id?state.bills.find(x=>x.id===id):null;
    const initialFrequency=billFrequency(b);
    const initialDueDay=String(b?.dueDay||'1');
    const initialAnchor=b?.anchorDate||todayISO();
    const dayOptions=Array.from({length:31},(_,i)=>{
      const day=i+1;
      return `<option value="${day}" ${initialDueDay===String(day)?'selected':''}>${ordinal(day)} day of each month</option>`;
    }).join('')+`<option value="last" ${initialDueDay==='last'?'selected':''}>Last day of each month</option>`;

    openSheet(b?'Edit Bill':'Add Bill',`
      <form id="billForm" class="form-grid">
        <div class="field"><label for="billName">Bill name</label><input id="billName" maxlength="60" required value="${escapeHtml(b?.name||'')}" placeholder="Rent, phone, Netflix…"></div>
        <div class="field"><label for="billAmount">Amount</label><input id="billAmount" inputmode="decimal" type="number" min="0" step="0.01" required value="${b?escapeHtml(b.amount):''}" placeholder="0.00"></div>

        <div class="field">
          <label for="billFrequency">Occurrence</label>
          <select id="billFrequency">
            <option value="monthly" ${initialFrequency==='monthly'?'selected':''}>Monthly</option>
            <option value="biweekly" ${initialFrequency==='biweekly'?'selected':''}>Biweekly (every 2 weeks)</option>
            <option value="quarterly" ${initialFrequency==='quarterly'?'selected':''}>Quarterly (every 3 months)</option>
            <option value="semiannual" ${initialFrequency==='semiannual'?'selected':''}>Every 6 months</option>
            <option value="yearly" ${initialFrequency==='yearly'?'selected':''}>Yearly</option>
            <option value="once" ${initialFrequency==='once'?'selected':''}>One-time bill</option>
          </select>
          <div class="help">How often this bill repeats.</div>
        </div>

        <div id="billScheduleFields"></div>

        <label class="notice" style="display:flex;gap:9px;align-items:center"><input id="billAutopay" type="checkbox" ${b?.autopay?'checked':''}> <span><strong>Autopay</strong><br><span class="small">Just a label—this app never connects to your bank.</span></span></label>
        <button class="btn primary full" type="submit">${b?'Save bill':'Add bill'}</button>
        ${b?'<button class="btn danger full" id="deleteBillBtn" type="button">Delete bill</button>':''}
      </form>`);

    const renderScheduleFields=()=>{
      const frequency=$('#billFrequency').value;
      const holder=$('#billScheduleFields');

      if(frequency==='monthly'){
        holder.innerHTML=`
          <div class="field">
            <label for="billDay">Due date</label>
            <select id="billDay">${dayOptions}</select>
            <div class="help">Choose the 1st, 15th, last day of the month, or whichever day this bill is normally due.</div>
          </div>`;
        return;
      }

      const labels={
        biweekly:['Due date','Choose one due date and the app will repeat it every 2 weeks from there.'],
        quarterly:['Due date','The app will repeat this bill every 3 months from this date.'],
        semiannual:['Due date','The app will repeat this bill every 6 months from this date.'],
        yearly:['Due date','The month and day will repeat every year.'],
        once:['Due date','This bill will only appear once.']
      };
      const [label,help]=labels[frequency]||labels.once;
      holder.innerHTML=`
        <div class="field">
          <label for="billAnchorDate">${label}</label>
          <input id="billAnchorDate" type="date" required value="${escapeHtml(initialAnchor)}">
          <div class="help">${help}</div>
        </div>`;
    };

    $('#billFrequency').addEventListener('change',renderScheduleFields);
    renderScheduleFields();

    $('#billForm').addEventListener('submit',e=>{
      e.preventDefault();
      const amount=num($('#billAmount').value);
      const frequency=$('#billFrequency').value;
      if(amount<=0){showToast('Enter a bill amount');return;}

      const rec={
        id:b?.id||uid(),
        name:$('#billName').value.trim(),
        amount,
        frequency,
        autopay:$('#billAutopay').checked,
        createdOn:b?.createdOn||todayISO()
      };

      if(frequency==='monthly'){
        rec.dueDay=$('#billDay').value||'1';
      }else{
        const anchorDate=$('#billAnchorDate').value;
        if(!anchorDate){showToast('Choose a due date');return;}
        rec.anchorDate=anchorDate;
      }

      if(b) state.bills=state.bills.map(x=>x.id===b.id?rec:x); else state.bills.push(rec);
      closeSheet(); saveState(b?'Bill updated':'Bill added');
    });
    $('#deleteBillBtn')?.addEventListener('click',()=>{if(confirm('Delete this bill? Existing transactions will stay.')){state.bills=state.bills.filter(x=>x.id!==b.id);closeSheet();saveState('Bill deleted');}});
  }
  function markBillPaid(billId,dueDate){
    const b=state.bills.find(x=>x.id===billId); if(!b) return;
    if(isBillOccurrencePaid(billId,dueDate)){showToast('That bill is already marked paid');return;}
    const finish=()=>{
      const plan=currentPlan();
      state.transactions.push({id:uid(),type:'expense',category:'bills',amount:num(b.amount),note:b.name,date:todayISO(),planId:plan?.id||'',goalId:'',debtId:'',billId:b.id,billDueDate:dueDate});
      closeSheet();saveState(`${b.name} marked paid`);
    };
    if(simpleMode() && state.simple.balance!==null){
      openSheet('Bill paid • check your balance',`<form id="paidBalanceForm" class="form-grid">
        <div class="notice"><strong>${escapeHtml(b.name)}: ${money(b.amount)}</strong><div style="margin-top:6px">Once marked paid, this bill won't be reserved again for this due date. Enter your <strong>actual remaining account balance</strong> after the payment, so your spending estimate stays accurate.</div></div>
        <div class="field"><label for="paidBalance">Money in your account now ($)</label><input id="paidBalance" type="number" min="-100000000" max="100000000" step="0.01" inputmode="decimal" required value="${escapeHtml(state.simple.balance)}"><div class="help">If your account balance already reflects the payment, keep that balance. Do not subtract it twice.</div></div>
        <button class="btn primary full" type="submit">Save balance & mark paid</button></form>`);
      $('#paidBalanceForm').addEventListener('submit',e=>{e.preventDefault();const amount=Number($('#paidBalance').value);if(!Number.isFinite(amount)||Math.abs(amount)>100000000){showToast('Enter a valid balance');return;}state.simple.balance=Math.round(amount*100)/100;state.simple.balanceUpdatedAt=new Date().toLocaleString();finish();});
      return;
    }
    finish();
  }

  function openPlanForm(id=null,forceNew=false){

    const next=p?.nextPayDate||'';
    openSheet(p?'Edit Paycheck Plan':'New Paycheck Plan',`
      <form id="planForm" class="form-grid">
        <div class="field"><label for="planName">Plan name</label><input id="planName" maxlength="60" value="${escapeHtml(p?.name||'')}" placeholder="Aug 31 Paycheck"></div>

        <div class="field-row"><div class="field"><label for="planStart">Pay date</label><input id="planStart" type="date" required value="${start}"></div><div class="field"><label for="planNext">Next payday</label><input id="planNext" type="date" required value="${next}"></div></div>
        <div class="divider"></div>
        ${BUDGET_CATEGORIES.map(c=>`<div class="field"><label class="icon-label" for="budget_${c}">${duck(c,'tiny')}<span>${CATEGORIES[c].label}</span></label><input id="budget_${c}" inputmode="decimal" type="number" min="0" step="0.01" value="${p?escapeHtml(p.budgets?.[c]||0):'0'}"></div>`).join('')}
        <div class="notice" id="planMath">Enter your paycheck and category amounts to see what’s unassigned.</div>
        <button class="btn primary full" type="submit">${p?'Save plan':'Start this paycheck plan'}</button>
        ${p?'<button class="btn danger full" id="deletePlanBtn" type="button">Delete plan</button>':''}
      </form>`);
    const updateMath=()=>{
      const income=num($('#planIncome').value); const allocated=BUDGET_CATEGORIES.reduce((s,c)=>s+num($(`#budget_${c}`).value),0); const left=income-allocated;
      $('#planMath').innerHTML=`${coinIcon()} <strong>${money(left)}</strong> ${left>=0?'unassigned':'over-planned'} from this paycheck.`;
      $('#planMath').classList.toggle('danger',left<0);
    };
    ['planIncome',...BUDGET_CATEGORIES.map(c=>'budget_'+c)].forEach(id2=>$(`#${id2}`)?.addEventListener('input',updateMath)); updateMath();
    $('#planForm').addEventListener('submit',e=>{
      e.preventDefault(); const income=num($('#planIncome').value), startDate=$('#planStart').value, nextPayDate=$('#planNext').value;
      if(income<=0){showToast('Enter your paycheck amount');return;}
      if(!startDate||!nextPayDate||parseDate(nextPayDate)<=parseDate(startDate)){showToast('Next payday must be after this payday');return;}
      const budgets={}; BUDGET_CATEGORIES.forEach(c=>budgets[c]=num($(`#budget_${c}`).value));
      const rec={id:p?.id||uid(),name:$('#planName').value.trim()||`${formatDate(startDate)} Paycheck`,income,startDate,nextPayDate,budgets,active:true,createdAt:p?.createdAt||Date.now()};
      state.plans.forEach(x=>x.active=false);
      if(p) state.plans=state.plans.map(x=>x.id===p.id?rec:x); else state.plans.push(rec);
      closeSheet(); setTab('planner'); saveState(p?'Plan updated':'Paycheck plan started');
    });
    $('#deletePlanBtn')?.addEventListener('click',()=>{if(confirm('Delete this paycheck plan? Transactions will stay in your history.')){state.plans=state.plans.filter(x=>x.id!==p.id); if(state.plans.length&&!state.plans.some(x=>x.active)) state.plans[state.plans.length-1].active=true;closeSheet();saveState('Plan deleted');}});
  }

  function isRunningStandalone(){
    return window.matchMedia?.('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  async function installDuckBudget(){
    if(isRunningStandalone()){
      showToast('Duck Budget is already installed');
      return;
    }
    if(deferredInstallPrompt){
      deferredInstallPrompt.prompt();
      try{ await deferredInstallPrompt.userChoice; }catch(err){}
      deferredInstallPrompt = null;
      return;
    }
    alert('To add Duck Budget as an app, open your browser menu/share menu and choose “Add to Home Screen” or “Install app.” Once added, it will open in its own app-style window.');
  }

      <div class="settings-section"><h3>Privacy</h3><div class="small muted">No bank login, card number, routing number, or account number is needed. This version has no server and sends no budget data anywhere.</div></div>
      <div class="settings-section"><h3>Reset</h3><button class="btn danger full" id="resetBtn" type="button">Erase all budget data on this device</button></div>`);
    $('#modeToggleBtn').addEventListener('click',()=>{state.simple.enabled=!simpleMode();closeSheet();currentTab='home';setTab('home');saveState(state.simple.enabled?'Catch-Up Mode enabled':'Classic Planner enabled');});
    $('#installAppBtn')?.addEventListener('click',installDuckBudget);
    $('#exportBtn').addEventListener('click',exportBackup);
    $('#importInput').addEventListener('change',importBackup);
    $('#resetBtn').addEventListener('click',()=>{if(confirm('Erase ALL Duck Budget data saved in this browser? This cannot be undone unless you exported a backup.')){localStorage.removeItem(STORAGE_KEY);state=defaultState();closeSheet();setTab('home');renderAll();showToast('All local data erased');}});
  }

  function exportBackup(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`duck-budget-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500); showToast('Backup exported');
  }
  function importBackup(e){
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{ const parsed=JSON.parse(reader.result); const normalized=normalizeState(parsed); if(!confirm('Replace the budget data on this device with this backup?')) return; state=normalized; saveState('Backup imported'); closeSheet(); }
      catch(err){ showToast('That file is not a valid Duck Budget backup'); }
    };
    reader.readAsText(file);
  }

  $('#settingsBtn').addEventListener('click',()=>openSettings());
  $('#quickAddBtn').addEventListener('click',()=>openTransactionForm());
  $('#closeSheetBtn').addEventListener('click',closeSheet);
  $('#sheetBackdrop').addEventListener('click',e=>{if(e.target===$('#sheetBackdrop'))closeSheet();});
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetBackdrop').classList.contains('open'))closeSheet();});

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }

  renderAll();
})();
</script>
</body>
</html>
