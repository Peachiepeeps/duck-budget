<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#78b98b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Duck Budget" />
  <title>Duck Budget</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/budgeticon-180.png" />
  <style>
    :root {
      --green-900:#315743;
      --green-800:#3e6a51;
      --green-700:#4e7f60;
      --green-600:#66a77d;
      --green-500:#78b98b;
      --green-300:#b9dfc3;
      --green-200:#d6eddc;
      --green-100:#edf8ef;
      --cream:#fffaf0;
      --paper:#fffef9;
      --ink:#2f3a33;
      --muted:#758078;
      --line:#dfe8e1;
      --shadow:0 8px 24px rgba(45,74,57,.10);
      --danger:#b44b56;
      --danger-soft:#f9e4e6;
      --warning:#a77722;
      --warning-soft:#fff1cf;
      --food:#f4b46f;
      --fun:#eaa7bd;
      --bills:#f2d66b;
      --shopping:#c9b2e8;
      --savings:#9ed7b0;
      --debt:#ee9a9a;
      --income:#9bbfd9;
    }
    *{box-sizing:border-box}
    html{background:var(--green-100)}
    body{
      margin:0;
      color:var(--ink);
      background:linear-gradient(180deg,#f6fbf7 0%,#edf7ef 100%);
      font-family:ui-rounded,"SF Pro Rounded","Nunito",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      min-height:100dvh;
    }
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(102,167,125,.35);outline-offset:2px}
    .app{
      width:min(100%,520px);
      margin:0 auto;
      min-height:100dvh;
      padding:calc(16px + env(safe-area-inset-top)) 16px calc(96px + env(safe-area-inset-bottom));
    }
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-mark{width:44px;height:44px;border-radius:14px;background:var(--green-200);display:grid;place-items:center;font-size:24px;overflow:hidden;border:1px solid rgba(49,87,67,.08)}
    .brand-mark img{width:100%;height:100%;object-fit:cover}
    .brand h1{font-size:21px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
    .brand p{margin:3px 0 0;color:var(--muted);font-size:12px}
    .icon-btn{border:0;background:var(--paper);width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px;color:var(--green-900)}
    .page{display:none;animation:fade .18s ease}
    .page.active{display:block}
    @keyframes fade{from{opacity:.5;transform:translateY(2px)}to{opacity:1;transform:none}}
    .card{background:var(--paper);border:1px solid rgba(49,87,67,.08);border-radius:22px;box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
    .hero{background:linear-gradient(145deg,#416d53,#6eaa7d);color:white;padding:20px;position:relative;overflow:hidden}
    .hero::after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:rgba(255,255,255,.08);right:-85px;top:-90px}
    .eyebrow{text-transform:uppercase;letter-spacing:.08em;font-size:11px;font-weight:800;opacity:.78}
    .hero-value{font-size:42px;line-height:1.05;font-weight:900;letter-spacing:-.04em;margin:6px 0 4px;word-break:break-word}
    .hero-sub{font-size:13px;opacity:.9}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px;position:relative;z-index:1}
    .hero-stat{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px}
    .hero-stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.06em;opacity:.72}
    .hero-stat strong{display:block;font-size:16px;margin-top:2px}
    .section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 2px 10px}
    .section-head h2{font-size:16px;margin:0;letter-spacing:-.01em}
    .section-head button,.text-btn{border:0;background:none;color:var(--green-700);font-weight:800;padding:6px;font-size:13px}
    .empty{text-align:center;padding:24px 10px;color:var(--muted)}
    .empty .big{font-size:34px;margin-bottom:6px}
    .empty strong{display:block;color:var(--ink);margin-bottom:4px}
    .btn{border:0;border-radius:14px;padding:12px 15px;font-weight:800;min-height:44px}
    .btn.primary{background:var(--green-700);color:white}
    .btn.soft{background:var(--green-100);color:var(--green-900)}
    .btn.warn{background:var(--warning-soft);color:var(--warning)}
    .btn.danger{background:var(--danger-soft);color:var(--danger)}
    .btn.full{width:100%}
    .btn-row{display:flex;gap:9px;flex-wrap:wrap}
    .btn-row .btn{flex:1 1 130px}
    .budget-list{display:grid;gap:11px}
    .budget-row{display:grid;grid-template-columns:48px 1fr auto;gap:10px;align-items:center}
    .duck-avatar{position:relative;width:44px;height:44px;border-radius:15px;display:grid;place-items:center;overflow:hidden;background:var(--green-100);font-size:22px;flex:0 0 auto}
    .duck-avatar .duck-fallback{position:absolute;inset:0;display:grid;place-items:center}
    .duck-avatar img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;background:transparent}
    .duck-avatar.tiny{width:30px;height:30px;border-radius:10px;font-size:16px}
    .icon-label{display:flex;align-items:center;gap:8px;min-width:0}
    .icon-label > span:last-child{min-width:0}
    .asset-icon{width:30px;height:30px;object-fit:contain;vertical-align:middle;display:inline-block}
    .asset-icon.coin{width:24px;height:24px}
    .section-duck-title{display:flex;align-items:center;gap:9px}
    .section-duck-title .duck-avatar{width:40px;height:40px;border-radius:13px}
    .debt-card{padding:14px;border:1px solid var(--line);border-radius:18px;background:white}
    .debt-card + .debt-card{margin-top:9px}
    .debt-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .debt-top strong{font-size:15px}
    .debt-top .amount{font-size:13px}
    .budget-copy{min-width:0}
    .budget-top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .budget-top strong{font-size:14px}
    .budget-top span{font-size:12px;color:var(--muted);white-space:nowrap}
    .progress{height:8px;background:#edf1ed;border-radius:999px;overflow:hidden;margin-top:7px}
    .progress > span{display:block;height:100%;border-radius:inherit;background:var(--green-600);width:0;transition:width .2s ease}
    .progress.over > span{background:var(--danger)}
    .budget-left{font-size:12px;font-weight:800;color:var(--green-800);white-space:nowrap}
    .budget-left.over{color:var(--danger)}
    .list{display:grid;gap:8px}
    .list-item{display:flex;align-items:center;gap:11px;padding:11px;border:1px solid var(--line);border-radius:16px;background:white;min-width:0}
    .item-copy{min-width:0;flex:1}
    .item-copy strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .item-copy span{display:block;color:var(--muted);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .amount{font-weight:900;font-size:14px;white-space:nowrap}
    .amount.income{color:var(--green-700)}
    .mini-action{border:0;background:var(--green-100);color:var(--green-800);font-weight:800;font-size:12px;border-radius:10px;padding:8px 10px;min-height:34px}
    .mini-action.danger{background:var(--danger-soft);color:var(--danger)}
    .two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric{border:1px solid var(--line);border-radius:17px;padding:13px;background:white}
    .metric span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:800}
    .metric strong{display:block;margin-top:5px;font-size:20px;letter-spacing:-.02em}
    .page-title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 2px 14px}
    .page-title h2{margin:0;font-size:24px;letter-spacing:-.03em}
    .pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;background:var(--green-100);color:var(--green-800);font-size:11px;font-weight:800;padding:6px 9px}
    .pill.overdue{background:var(--danger-soft);color:var(--danger)}
    .pill.paid{background:#e4f4e8;color:#39724a}
    .plan-name{font-size:20px;font-weight:900;margin:3px 0 2px}
    .muted{color:var(--muted)}
    .small{font-size:12px}
    .planner-alloc{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
    .alloc{border-radius:16px;padding:12px;border:1px solid var(--line);background:white}
    .alloc strong{display:block;font-size:13px}
    .alloc span{display:block;font-size:18px;font-weight:900;margin-top:4px}
    .goal-card{padding:14px;border:1px solid var(--line);border-radius:18px;background:white}
    .goal-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
    .goal-top strong{font-size:15px}
    .goal-top .amount{font-size:13px}
    .goal-actions{display:flex;gap:8px;margin-top:10px}
    .goal-actions button{flex:1}
    .fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:calc(78px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:20px;border:0;background:var(--green-800);color:white;font-size:30px;line-height:1;box-shadow:0 10px 26px rgba(49,87,67,.28);z-index:25}
    .bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(100%,520px);z-index:20;background:rgba(255,254,249,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
    .nav-btn{border:0;background:transparent;color:var(--muted);min-height:55px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:800}
    .nav-btn .nav-icon{width:28px;height:28px;display:grid;place-items:center;line-height:1}
    .nav-btn .nav-icon img{width:100%;height:100%;object-fit:contain;display:block}
    .nav-btn.active{background:var(--green-100);color:var(--green-900)}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(25,38,30,.34);z-index:60;display:none;align-items:flex-end;justify-content:center;padding-top:32px}
    .sheet-backdrop.open{display:flex}
    .sheet{width:min(100%,520px);max-height:92dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:14px 16px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -18px 50px rgba(24,45,31,.18)}
    .sheet-handle{width:46px;height:5px;border-radius:999px;background:#d9ded9;margin:0 auto 12px}
    .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .sheet-head h2{font-size:20px;margin:0}
    .close-btn{border:0;background:var(--green-100);width:40px;height:40px;border-radius:13px;font-size:18px;color:var(--green-900)}
    .form-grid{display:grid;gap:13px}
    .field label{display:block;font-size:12px;font-weight:900;margin:0 0 6px;color:var(--green-900)}
    .field input,.field select,.field textarea{width:100%;border:1px solid #dce5de;background:white;border-radius:13px;padding:12px 12px;color:var(--ink);min-height:46px;font-size:16px}
    .field textarea{min-height:82px;resize:vertical}
    .field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .help{font-size:11px;color:var(--muted);margin-top:5px;line-height:1.4}
    .segmented{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;background:var(--green-100);border-radius:14px;padding:4px}
    .segmented button{border:0;background:transparent;color:var(--green-800);padding:9px 5px;border-radius:11px;font-size:11px;font-weight:900;min-height:42px}
    .segmented button.active{background:white;box-shadow:0 3px 10px rgba(49,87,67,.08);color:var(--ink)}
    .category-picker{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .cat-choice{border:1px solid var(--line);background:white;border-radius:14px;padding:8px 5px;min-height:76px;font-size:10px;font-weight:800;color:var(--ink)}
    .cat-choice .duck-avatar{width:38px;height:38px;margin:0 auto 4px;border-radius:12px}
    .cat-choice.selected{border:2px solid var(--green-600);background:var(--green-100)}
    .notice{border-radius:15px;padding:11px 12px;font-size:12px;line-height:1.45;background:var(--green-100);color:var(--green-900)}
    .notice.warn{background:var(--warning-soft);color:#765518}
    .notice.danger{background:var(--danger-soft);color:#863843}
    .divider{height:1px;background:var(--line);margin:16px 0}
    .settings-section h3{font-size:15px;margin:0 0 9px}
    .settings-section + .settings-section{margin-top:20px}
    .hidden{display:none!important}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(146px + env(safe-area-inset-bottom));z-index:100;background:#2f4537;color:white;padding:10px 14px;border-radius:12px;font-size:12px;font-weight:800;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
    @media(min-width:700px){
      body{padding:18px 0}.app{border-radius:28px;background:#f5faf6;box-shadow:0 18px 60px rgba(45,74,57,.12);min-height:calc(100dvh - 36px)}
      .bottom-nav{bottom:18px;border:1px solid var(--line);border-radius:20px;width:500px;padding:7px}
      .fab{bottom:98px}
      .sheet{border-radius:26px;margin-bottom:18px;max-height:88dvh}
      .sheet-backdrop{align-items:flex-end}
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><img src="images/budgeticon.png" alt="" onerror="this.remove();this.parentElement.textContent='🦆'" /></div>
        <div>
          <h1>Duck Budget</h1>
          <p id="todayLabel">Your cozy paycheck planner</p>
        </div>
      </div>
      <button class="icon-btn" id="settingsBtn" type="button" aria-label="Open settings">⚙️</button>
    </header>

    <section class="page active" id="page-home" data-page="home"></section>
    <section class="page" id="page-transactions" data-page="transactions"></section>
    <section class="page" id="page-bills" data-page="bills"></section>
    <section class="page" id="page-planner" data-page="planner"></section>
    <section class="page" id="page-goals" data-page="goals"></section>
  </main>

  <button class="fab" id="quickAddBtn" type="button" aria-label="Add transaction">+</button>

  <nav class="bottom-nav" aria-label="Main navigation">
    <button class="nav-btn active" data-tab="home" type="button"><span class="nav-icon"><img src="images/sticker-heart.png" alt=""></span><span>Home</span></button>
    <button class="nav-btn" data-tab="transactions" type="button"><span class="nav-icon"><img src="images/sticker-coin.png" alt=""></span><span>Transactions</span></button>
    <button class="nav-btn" data-tab="bills" type="button"><span class="nav-icon"><img src="images/sticker-crown.png" alt=""></span><span>Bills</span></button>
    <button class="nav-btn" data-tab="planner" type="button"><span class="nav-icon"><img src="images/stickerbook-icon.png" alt=""></span><span>Planner</span></button>
    <button class="nav-btn" data-tab="goals" type="button"><span class="nav-icon"><img src="images/sticker-sparkles.png" alt=""></span><span>Goals</span></button>
  </nav>

  <div class="sheet-backdrop" id="sheetBackdrop" aria-hidden="true">
    <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
      <div class="sheet-handle"></div>
      <div class="sheet-head">
        <h2 id="sheetTitle">Add</h2>
        <button class="close-btn" id="closeSheetBtn" type="button" aria-label="Close">✕</button>
      </div>
      <div id="sheetContent"></div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'duckBudget_v1';
  const CATEGORIES = {
    income:   { label:'Income',   emoji:'🎩', asset:'images/Fancy-duck.PNG', color:'var(--income)' },
    bills:    { label:'Bills',    emoji:'🍋', asset:'images/Lemon-duck.PNG',     color:'var(--bills)' },
    food:     { label:'Food',     emoji:'🍔', asset:'images/Burger-duck.PNG',    color:'var(--food)' },
    fun:      { label:'Fun',      emoji:'🎉', asset:'images/Party-hat-duck.PNG',     color:'var(--fun)' },
    shopping: { label:'Shopping / Other', emoji:'🐥', asset:'images/pile-of-tiny-ducks.png', color:'var(--shopping)' },
    savings:  { label:'Savings',  emoji:'😇', asset:'images/Angel-duck.PNG',     color:'var(--savings)' },
    debt:     { label:'Debt',     emoji:'😈', asset:'images/Demon-duck.PNG',     color:'var(--debt)' }
  };
  const BUDGET_CATEGORIES = ['bills','food','fun','shopping','savings','debt'];
  const FLEX_CATEGORIES = ['food','fun','shopping'];
  const FIXED_CATEGORIES = ['bills','savings','debt'];

  const $ = (sel, root=document) => root.querySelector(sel);
  const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2));
  const todayISO = () => {
    const d = new Date();
    return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  };
  const parseDate = (s) => {
    if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))) return null;
    const [y,m,d] = s.split('-').map(Number);
    return new Date(y,m-1,d,12,0,0,0);
  };
  const toISO = (d) => [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-');
  const formatDate = (s, opts={month:'short',day:'numeric'}) => {
    const d=parseDate(s); return d ? new Intl.DateTimeFormat(undefined,opts).format(d) : '—';
  };
  const daysBetween = (a,b) => {
    const da=parseDate(a), db=parseDate(b); if(!da||!db) return null;
    return Math.ceil((db-da)/86400000);
  };
  const money = (n) => {
    const value=Number(n)||0;
    return new Intl.NumberFormat(undefined,{style:'currency',currency:'USD',minimumFractionDigits:2,maximumFractionDigits:2}).format(value);
  };
  const num = (v) => Math.max(0, Number.parseFloat(v)||0);
  const escapeHtml = (v='') => String(v).replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));

  const defaultState = () => ({ version:1, plans:[], transactions:[], bills:[], goals:[], debts:[] });
  let state = loadState();
  let currentTab = 'home';
  let toastTimer = null;

  function loadState(){
    try{
      const raw=localStorage.getItem(STORAGE_KEY);
      if(!raw) return defaultState();
      const parsed=JSON.parse(raw);
      return normalizeState(parsed);
    }catch(err){ return defaultState(); }
  }
  function normalizeState(data){
    const base=defaultState();
    if(!data || typeof data!=='object') return base;
    for(const key of ['plans','transactions','bills','goals','debts']) base[key]=Array.isArray(data[key])?data[key]:[];
    return base;
  }
  function saveState(message){
    try{
      localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
      if(message) showToast(message);
    }catch(err){
      showToast('Could not save on this device. Try exporting a backup.');
    }
    renderAll();
  }
  function showToast(text){
    const t=$('#toast'); t.textContent=text; t.classList.add('show');
    clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
  }

  function currentPlan(){
    return state.plans.find(p=>p.active) || state.plans.slice().sort((a,b)=>String(b.startDate).localeCompare(String(a.startDate)))[0] || null;
  }
  function planTransactions(planId){ return state.transactions.filter(t=>t.planId===planId); }
  function categorySpent(plan, category){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.category===category && t.type!=='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function planExtraIncome(plan){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.type==='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function totalOutgoing(plan){
    if(!plan) return 0;
    return planTransactions(plan.id).filter(t=>t.type!=='income').reduce((s,t)=>s+num(t.amount),0);
  }
  function safeToSpend(plan){
    if(!plan) return 0;
    const available=num(plan.income)+planExtraIncome(plan);
    const spent=totalOutgoing(plan);
    const fixedRemaining=FIXED_CATEGORIES.reduce((sum,c)=>{
      const planned=num(plan.budgets?.[c]);
      const used=categorySpent(plan,c);
      return sum+Math.max(0,planned-used);
    },0);
    return available-spent-fixedRemaining;
  }
  function remainingInPlan(plan){ return plan ? num(plan.income)+planExtraIncome(plan)-totalOutgoing(plan) : 0; }
  function unassigned(plan){ return plan ? num(plan.income)-BUDGET_CATEGORIES.reduce((s,c)=>s+num(plan.budgets?.[c]),0) : 0; }

  function duck(category, cls=''){
    const c=CATEGORIES[category]||CATEGORIES.shopping;
    return `<span class="duck-avatar ${cls}" style="background:${c.color}"><img src="${c.asset}" alt="" onerror="this.style.display='none'"></span>`;
  }
  function assetIcon(path, cls='', alt=''){
    return `<img class="asset-icon ${cls}" src="${path}" alt="${escapeHtml(alt)}" onerror="this.style.display='none'">`;
  }
  function coinIcon(cls='coin'){
    return assetIcon('images/heart-coin.png',cls,'Heart coin');
  }

  function billOccurrencesBetween(bill,startISO,endISO){
    const start=parseDate(startISO), end=parseDate(endISO); if(!start||!end) return [];
    const out=[]; let cursor=new Date(start.getFullYear(),start.getMonth(),1,12);
    const endMonth=new Date(end.getFullYear(),end.getMonth(),1,12);
    while(cursor<=endMonth && out.length<24){
      const maxDay=new Date(cursor.getFullYear(),cursor.getMonth()+1,0).getDate();
      const d=new Date(cursor.getFullYear(),cursor.getMonth(),Math.min(Number(bill.dueDay)||1,maxDay),12);
      if(d>=start && d<end) out.push(toISO(d));
      cursor=new Date(cursor.getFullYear(),cursor.getMonth()+1,1,12);
    }
    return out;
  }
  function suggestedBills(plan){
    if(!plan) return {total:0,items:[]};
    const items=[];
    state.bills.forEach(b=>billOccurrencesBetween(b,plan.startDate,plan.nextPayDate).forEach(date=>items.push({bill:b,date})));
    return { total:items.reduce((s,x)=>s+num(x.bill.amount),0), items:items.sort((a,b)=>a.date.localeCompare(b.date)) };
  }
  function isBillOccurrencePaid(billId,dueISO){
    const due=parseDate(dueISO); if(!due) return false;
    return state.transactions.some(t=>t.billId===billId && t.type==='expense' && (()=>{ const td=parseDate(t.date); return td && td.getFullYear()===due.getFullYear() && td.getMonth()===due.getMonth(); })());
  }
  function nextBillOccurrence(bill){
    const today=parseDate(todayISO());
    for(let add=0; add<14; add++){
      const monthDate=new Date(today.getFullYear(),today.getMonth()+add,1,12);
      const maxDay=new Date(monthDate.getFullYear(),monthDate.getMonth()+1,0).getDate();
      const due=new Date(monthDate.getFullYear(),monthDate.getMonth(),Math.min(Number(bill.dueDay)||1,maxDay),12);
      const dueISO=toISO(due);
      if(add===0 && due<today && !isBillOccurrencePaid(bill.id,dueISO)) return dueISO;
      if(due>=today && !isBillOccurrencePaid(bill.id,dueISO)) return dueISO;
    }
    return null;
  }
  function upcomingBills(limit=99){
    return state.bills.map(b=>({bill:b,date:nextBillOccurrence(b)})).filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,limit);
  }

  function goalSaved(goal){
    return num(goal.startingSaved)+state.transactions.filter(t=>t.type==='savings'&&t.goalId===goal.id).reduce((s,t)=>s+num(t.amount),0);
  }
  function debtRemaining(debt){
    const paid=state.transactions.filter(t=>t.type==='debt'&&t.debtId===debt.id).reduce((s,t)=>s+num(t.amount),0);
    return Math.max(0,num(debt.startingBalance)-paid);
  }

      $('#billField').classList.toggle('hidden',!(type==='expense'&&category==='bills'));
    };
    $$('#txTypePicker button').forEach(b=>b.addEventListener('click',()=>setType(b.dataset.type)));
    $$('#categoryPicker .cat-choice').forEach(b=>b.addEventListener('click',()=>{
      category=b.dataset.category; $$('#categoryPicker .cat-choice').forEach(x=>x.classList.toggle('selected',x===b));
      $('#billField').classList.toggle('hidden',category!=='bills'||type!=='expense');
    }));
    setType(type);
    $('#txForm').addEventListener('submit',e=>{
      e.preventDefault();
      const amount=num($('#txAmount').value); if(amount<=0){showToast('Enter an amount greater than $0');return;}
      if(type==='debt' && !$('#txDebt').value){showToast('Choose which debt this payment is for');return;}
      const record={
        id:existing?.id||uid(), type, category, amount,
        note:$('#txNote').value.trim(), date:$('#txDate').value||todayISO(), planId:$('#txPlan').value||'',
        goalId:type==='savings'?$('#txGoal').value:'', debtId:type==='debt'?$('#txDebt').value:'',
        billId:(type==='expense'&&category==='bills')?$('#txBill').value:''
      };
      if(existing) state.transactions=state.transactions.map(t=>t.id===existing.id?record:t); else state.transactions.push(record);
      closeSheet(); saveState(existing?'Transaction updated':'Transaction added');
    });
    $('#deleteTxBtn')?.addEventListener('click',()=>{
      if(confirm('Delete this transaction?')){state.transactions=state.transactions.filter(t=>t.id!==existing.id);closeSheet();saveState('Transaction deleted');}
    });
  }

  function openBillForm(id=null){
    const b=id?state.bills.find(x=>x.id===id):null;
    openSheet(b?'Edit Bill':'Add Bill',`
      <form id="billForm" class="form-grid">
        <div class="field"><label for="billName">Bill name</label><input id="billName" maxlength="60" required value="${escapeHtml(b?.name||'')}" placeholder="Rent, phone, Netflix…"></div>
        <div class="field-row"><div class="field"><label for="billAmount">Amount</label><input id="billAmount" inputmode="decimal" type="number" min="0" step="0.01" required value="${b?escapeHtml(b.amount):''}" placeholder="0.00"></div><div class="field"><label for="billDay">Due day</label><input id="billDay" inputmode="numeric" type="number" min="1" max="31" required value="${b?escapeHtml(b.dueDay):''}" placeholder="15"></div></div>
        <label class="notice" style="display:flex;gap:9px;align-items:center"><input id="billAutopay" type="checkbox" ${b?.autopay?'checked':''}> <span><strong>Autopay</strong><br><span class="small">Just a label—this app never connects to your bank.</span></span></label>
        <button class="btn primary full" type="submit">${b?'Save bill':'Add bill'}</button>
        ${b?'<button class="btn danger full" id="deleteBillBtn" type="button">Delete bill</button>':''}
      </form>`);
    $('#billForm').addEventListener('submit',e=>{
      e.preventDefault(); const amount=num($('#billAmount').value), dueDay=Math.min(31,Math.max(1,parseInt($('#billDay').value,10)||1));
      if(amount<=0){showToast('Enter a bill amount');return;}
      const rec={id:b?.id||uid(),name:$('#billName').value.trim(),amount,dueDay,autopay:$('#billAutopay').checked};
      if(b) state.bills=state.bills.map(x=>x.id===b.id?rec:x); else state.bills.push(rec);
      closeSheet(); saveState(b?'Bill updated':'Bill added');
    });
    $('#deleteBillBtn')?.addEventListener('click',()=>{if(confirm('Delete this bill? Existing transactions will stay.')){state.bills=state.bills.filter(x=>x.id!==b.id);closeSheet();saveState('Bill deleted');}});
  }

  function markBillPaid(billId,dueDate){
    const b=state.bills.find(x=>x.id===billId); if(!b) return;
    if(isBillOccurrencePaid(billId,dueDate)){showToast('That bill is already marked paid');return;}
    const plan=currentPlan();
    state.transactions.push({id:uid(),type:'expense',category:'bills',amount:num(b.amount),note:b.name,date:todayISO(),planId:plan?.id||'',goalId:'',debtId:'',billId:b.id});
    saveState(`${b.name} marked paid`);
  }

  function openPlanForm(id=null,forceNew=false){
    const p=(!forceNew&&id)?state.plans.find(x=>x.id===id):null;
    const start=p?.startDate||todayISO();
    const next=p?.nextPayDate||'';
    openSheet(p?'Edit Paycheck Plan':'New Paycheck Plan',`
      <form id="planForm" class="form-grid">
        <div class="field"><label for="planName">Plan name</label><input id="planName" maxlength="60" value="${escapeHtml(p?.name||'')}" placeholder="Aug 31 Paycheck"></div>
        <div class="field"><label for="planIncome">Paycheck amount</label><input id="planIncome" inputmode="decimal" type="number" min="0" step="0.01" required value="${p?escapeHtml(p.income):''}" placeholder="0.00"><div class="help">Put your main paycheck here. Use an Income transaction later for refunds or extra money.</div></div>
        <div class="field-row"><div class="field"><label for="planStart">Pay date</label><input id="planStart" type="date" required value="${start}"></div><div class="field"><label for="planNext">Next payday</label><input id="planNext" type="date" required value="${next}"></div></div>
        <div class="divider"></div>
        ${BUDGET_CATEGORIES.map(c=>`<div class="field"><label class="icon-label" for="budget_${c}">${duck(c,'tiny')}<span>${CATEGORIES[c].label}</span></label><input id="budget_${c}" inputmode="decimal" type="number" min="0" step="0.01" value="${p?escapeHtml(p.budgets?.[c]||0):'0'}"></div>`).join('')}
        <div class="notice" id="planMath">Enter your paycheck and category amounts to see what’s unassigned.</div>
        <button class="btn primary full" type="submit">${p?'Save plan':'Start this paycheck plan'}</button>
        ${p?'<button class="btn danger full" id="deletePlanBtn" type="button">Delete plan</button>':''}
      </form>`);
    const updateMath=()=>{
      const income=num($('#planIncome').value); const allocated=BUDGET_CATEGORIES.reduce((s,c)=>s+num($(`#budget_${c}`).value),0); const left=income-allocated;
      $('#planMath').innerHTML=`${coinIcon()} <strong>${money(left)}</strong> ${left>=0?'unassigned':'over-planned'} from this paycheck.`;
      $('#planMath').classList.toggle('danger',left<0);
    };
    ['planIncome',...BUDGET_CATEGORIES.map(c=>'budget_'+c)].forEach(id2=>$(`#${id2}`)?.addEventListener('input',updateMath)); updateMath();
    $('#planForm').addEventListener('submit',e=>{
      e.preventDefault(); const income=num($('#planIncome').value), startDate=$('#planStart').value, nextPayDate=$('#planNext').value;
      if(income<=0){showToast('Enter your paycheck amount');return;}
      if(!startDate||!nextPayDate||parseDate(nextPayDate)<=parseDate(startDate)){showToast('Next payday must be after this payday');return;}
      const budgets={}; BUDGET_CATEGORIES.forEach(c=>budgets[c]=num($(`#budget_${c}`).value));
      const rec={id:p?.id||uid(),name:$('#planName').value.trim()||`${formatDate(startDate)} Paycheck`,income,startDate,nextPayDate,budgets,active:true,createdAt:p?.createdAt||Date.now()};
      state.plans.forEach(x=>x.active=false);
      if(p) state.plans=state.plans.map(x=>x.id===p.id?rec:x); else state.plans.push(rec);
      closeSheet(); setTab('planner'); saveState(p?'Plan updated':'Paycheck plan started');
    });
    $('#deletePlanBtn')?.addEventListener('click',()=>{if(confirm('Delete this paycheck plan? Transactions will stay in your history.')){state.plans=state.plans.filter(x=>x.id!==p.id); if(state.plans.length&&!state.plans.some(x=>x.active)) state.plans[state.plans.length-1].active=true;closeSheet();saveState('Plan deleted');}});
  }

  function openGoalForm(id=null){
    const g=id?state.goals.find(x=>x.id===id):null;
    openSheet(g?'Edit Goal':'New Savings Goal',`
      <form id="goalForm" class="form-grid">
        <div class="field"><label for="goalName">Goal name</label><input id="goalName" required maxlength="60" value="${escapeHtml(g?.name||'')}" placeholder="Emergency fund, trip…"></div>
        <div class="field-row"><div class="field"><label for="goalTarget">Target</label><input id="goalTarget" type="number" inputmode="decimal" min="0" step="0.01" required value="${g?escapeHtml(g.target):''}" placeholder="1000"></div><div class="field"><label for="goalStart">Already saved</label><input id="goalStart" type="number" inputmode="decimal" min="0" step="0.01" value="${g?escapeHtml(g.startingSaved||0):'0'}"></div></div>
        <button class="btn primary full" type="submit">${g?'Save goal':'Create goal'}</button>
        ${g?'<button class="btn danger full" id="deleteGoalBtn" type="button">Delete goal</button>':''}
      </form>`);
    $('#goalForm').addEventListener('submit',e=>{e.preventDefault(); const target=num($('#goalTarget').value);if(target<=0){showToast('Enter a goal amount');return;}const rec={id:g?.id||uid(),name:$('#goalName').value.trim(),target,startingSaved:num($('#goalStart').value)};if(g)state.goals=state.goals.map(x=>x.id===g.id?rec:x);else state.goals.push(rec);closeSheet();saveState(g?'Goal updated':'Goal created');});
    $('#deleteGoalBtn')?.addEventListener('click',()=>{if(confirm('Delete this goal? Savings transactions will remain in your history.')){state.goals=state.goals.filter(x=>x.id!==g.id);closeSheet();saveState('Goal deleted');}});
  }

  function openDebtForm(id=null){
    const d=id?state.debts.find(x=>x.id===id):null;
    openSheet(d?'Edit Debt':'Add Debt',`
      <form id="debtForm" class="form-grid">
        <div class="field"><label for="debtName">Nickname</label><input id="debtName" required maxlength="60" value="${escapeHtml(d?.name||'')}" placeholder="Card A, car loan…"><div class="help">Use a nickname only—never enter account or card numbers.</div></div>
        <div class="field-row"><div class="field"><label for="debtBalance">Current balance</label><input id="debtBalance" type="number" inputmode="decimal" min="0" step="0.01" required value="${d?escapeHtml(d.startingBalance):''}" placeholder="0.00"></div><div class="field"><label for="debtMin">Minimum payment</label><input id="debtMin" type="number" inputmode="decimal" min="0" step="0.01" value="${d?escapeHtml(d.minimumPayment||0):'0'}"></div></div>
        <div class="notice warn">Debt balances here are a personal tracker only. Interest and new charges are not added automatically, so you can edit the balance whenever you want to resync it.</div>
        <button class="btn primary full" type="submit">${d?'Save debt':'Add debt'}</button>
        ${d?'<button class="btn danger full" id="deleteDebtBtn" type="button">Delete debt</button>':''}
      </form>`);
    $('#debtForm').addEventListener('submit',e=>{e.preventDefault();const bal=num($('#debtBalance').value);const rec={id:d?.id||uid(),name:$('#debtName').value.trim(),startingBalance:bal,minimumPayment:num($('#debtMin').value)};if(d)state.debts=state.debts.map(x=>x.id===d.id?rec:x);else state.debts.push(rec);closeSheet();saveState(d?'Debt updated':'Debt added');});
    $('#deleteDebtBtn')?.addEventListener('click',()=>{if(confirm('Delete this debt tracker? Debt payment transactions will stay.')){state.debts=state.debts.filter(x=>x.id!==d.id);closeSheet();saveState('Debt deleted');}});
  }

  function openSettings(){
    openSheet('Settings',`
      <div class="settings-section"><h3>💾 Backup</h3><div class="notice">Your budget stays in this browser on this device. Export a backup occasionally—especially before clearing browser data or changing the GitHub Pages URL.</div><div class="btn-row" style="margin-top:10px"><button class="btn soft" id="exportBtn" type="button">Export backup</button><label class="btn soft" style="display:grid;place-items:center;text-align:center"><input id="importInput" type="file" accept="application/json,.json" hidden>Import backup</label></div></div>
      <div class="settings-section"><h3>🔒 Privacy</h3><div class="small muted">No bank login, card number, routing number, or account number is needed. This version has no server and sends no budget data anywhere.</div></div>
      <div class="settings-section"><h3>Reset</h3><button class="btn danger full" id="resetBtn" type="button">Erase all budget data on this device</button></div>`);
    $('#exportBtn').addEventListener('click',exportBackup);
    $('#importInput').addEventListener('change',importBackup);
    $('#resetBtn').addEventListener('click',()=>{if(confirm('Erase ALL Duck Budget data saved in this browser? This cannot be undone unless you exported a backup.')){localStorage.removeItem(STORAGE_KEY);state=defaultState();closeSheet();setTab('home');renderAll();showToast('All local data erased');}});
  }

  function exportBackup(){
    const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`duck-budget-backup-${todayISO()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),500); showToast('Backup exported');
  }
  function importBackup(e){
    const file=e.target.files?.[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{ const parsed=JSON.parse(reader.result); const normalized=normalizeState(parsed); if(!confirm('Replace the budget data on this device with this backup?')) return; state=normalized; saveState('Backup imported'); closeSheet(); }
      catch(err){ showToast('That file is not a valid Duck Budget backup'); }
    };
    reader.readAsText(file);
  }

  $('#settingsBtn').addEventListener('click',()=>openSettings());
  $('#quickAddBtn').addEventListener('click',()=>openTransactionForm());
  $('#closeSheetBtn').addEventListener('click',closeSheet);
  $('#sheetBackdrop').addEventListener('click',e=>{if(e.target===$('#sheetBackdrop'))closeSheet();});
  $$('.nav-btn').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#sheetBackdrop').classList.contains('open'))closeSheet();});

  renderAll();
})();
</script>
</body>
</html>
